services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }
  server:
    build: { context: ., dockerfile: Dockerfile, target: server }
    environment:
      DATABASE_HOST: db
      DATABASE_ADMIN_URL: postgres://postgres:postgres@db:5432/postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:-change-me-too}
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on: { db: { condition: service_healthy } }
    command: sh -c "node ../db/scripts/migrate.mjs && node ../db/scripts/bootstrap-admin.mjs ${ADMIN_EMAIL:-admin@example.com} ${ADMIN_PIN:-123456} || true; npx tsx src/index.ts"
    ports: ["3000:3000"]
  web:
    build: { context: ., dockerfile: Dockerfile, target: web }
    ports: ["8080:80"]
    depends_on: [server]
volumes: { dbdata: {}, uploads: {} }
